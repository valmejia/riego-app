<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydra Cloud · Prueba de GreenBot</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 24px; color: #dae2fd; background: #0b1326; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { line-height: 1.5; color: #bbcabf; }
  </style>
</head>
<body>
  <main>
    <h1>Prueba de GreenBot</h1>
    <p>El chat aparece en la esquina inferior derecha. Pega la URL del webhook del escenario Chat de Make en <code>data-webhook</code> y el id de la maceta en <code>data-device</code>.</p>
  </main>

  <!-- Sube data-history (por ejemplo a 6) cuando el escenario Chat reciba el historial completo. -->
  <script src="greenbot-widget.js"
          data-webhook="PEGA_AQUI_TU_WEBHOOK_URL"
          data-device="maceta1"
          data-history="1"
          defer></script>
</body>
</html>
